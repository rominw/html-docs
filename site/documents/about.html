      <p>
        留页收集一些值得留下的页面与想法。这里的内容不是套用同一模板的文章，
        而是一份份保持自身结构、排版和表达的独立 HTML 文档。
      </p>

        新文档放入 <code>site/documents</code> 后，首页会读取它的标题、摘要和日期。
        Cloudflare Workers Static Assets 负责将这些页面原样发布到网络。
      </p>
